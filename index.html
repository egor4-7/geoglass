<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geoglass — 3D Map & Live Bus</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b131e;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #0b131e;
    }

    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    .leaflet-control-attribution {
      display: none !important;
    }

    /* Верхняя панель */
    .top-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }

    .top-overlay > * {
      pointer-events: auto;
    }

    .weather-card {
      display: flex;
      align-items: center;
      background: rgba(15, 34, 61, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      gap: 8px;
    }

    .floor-selector {
      background: rgba(15, 34, 61, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .floor-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .floor-btn.active {
      background: #28a745;
      color: #ffffff;
      font-weight: bold;
    }

    /* Нижняя панель управления */
    .bottom-overlay {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .bottom-overlay > * {
      pointer-events: auto;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: #f4f1ea;
      border-radius: 26px;
      padding: 10px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 12px;
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      color: #0f223d;
      font-weight: 600;
      outline: none;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      background: rgba(15, 34, 61, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .category-chip.active {
      background: #28a745;
      border-color: #ffffff;
    }

    /* Модальное окно расписания автобусов (Liquid Glass) */
    .bus-sheet {
      position: absolute;
      bottom: 90px;
      left: 16px;
      right: 16px;
      background: rgba(15, 34, 61, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 16px;
      color: #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      z-index: 20;
      display: none;
    }

    .bus-sheet.open {
      display: block;
    }

    .bus-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 16px;
    }

    .bus-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
    }

    .bus-item {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      border-radius: 12px;
      align-items: center;
      font-size: 14px;
    }

    .badge-gal {
      background: #0056b3;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
    }

    .badge-gan {
      background: #d9534f;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
    }

    .bus-marker {
      background: rgba(40, 167, 69, 0.95);
      border: 2px solid #ffffff;
      border-radius: 20px;
      color: white;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="top-overlay">
    <div class="weather-card">
      <span>⛅</span> +28°C
    </div>
    
    <div class="floor-selector">
      <button class="floor-btn" onclick="setFloor('3')">3</button>
      <button class="floor-btn" onclick="setFloor('2')">2</button>
      <button class="floor-btn" onclick="setFloor('1')">1</button>
      <button class="floor-btn active" onclick="setFloor('0')">0</button>
      <button class="floor-btn" onclick="setFloor('-1')">-1</button>
      <button class="floor-btn" onclick="setFloor('-2')">-2</button>
    </div>
  </div>

  <!-- Выдвижная панель расписания транспорта -->
  <div class="bus-sheet" id="busSheet">
    <div class="bus-header">
      <span>🚍 D400: Газипаша — Аланья / Анталья</span>
      <span style="cursor:pointer; font-size: 18px;" onclick="toggleBusSheet()">✕</span>
    </div>
    <div class="bus-list">
      <div class="bus-item"><span class="badge-gal">GAL02</span><span>Газипаша - Аланья</span><b>06:36</b></div>
      <div class="bus-item"><span class="badge-gal">GAL02</span><span>Газипаша - Аланья</span><b>06:56</b></div>
      <div class="bus-item"><span class="badge-gal">GAL02</span><span>Газипаша - Аланья</span><b>07:16</b></div>
      <div class="bus-item"><span class="badge-gan">GAN01</span><span>Газипаша - Анталья</span><b>08:01</b></div>
      <div class="bus-item"><span class="badge-gal">GAL02</span><span>Газипаша - Аланья</span><b>08:16</b></div>
      <div class="bus-item"><span class="badge-gal">GAL02</span><span>Газипаша - Аланья</span><b>16:14</b></div>
      <div class="bus-item"><span class="badge-gal">GAL02</span><span>Газипаша - Аланья</span><b>17:14</b></div>
      <div class="bus-item"><span class="badge-gal">GAL02</span><span>Газипаша - Аланья</span><b>18:14</b></div>
    </div>
  </div>

  <div class="bottom-overlay">
    <div class="search-bar">
      <input type="text" class="search-input" placeholder="Поиск остановок D400...">
    </div>

    <div class="categories-scroll">
      <button class="category-chip active" onclick="setTab(this)">Все</button>
      <button class="category-chip" onclick="setTab(this)">Прогулки</button>
      <button class="category-chip" onclick="setTab(this)">Еда</button>
      <button class="category-chip" onclick="setTab(this, 'bus')">🚌 Транспорт (GAL02)</button>
      <button class="category-chip" onclick="setTab(this)">Пляжи</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map', { zoomControl: false }).setView([36.2655, 32.3025], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    var busIcon = L.divIcon({
      html: '<div class="bus-marker" onclick="toggleBusSheet()"><span>🚌</span> GAL02 • 3 мин</div>',
      className: '',
      iconSize: [150, 34],
      iconAnchor: [75, 17]
    });

    L.marker([36.2655, 32.3025], { icon: busIcon }).addTo(map);

    function toggleBusSheet() {
      var sheet = document.getElementById('busSheet');
      sheet.classList.toggle('open');
    }

    function setFloor(floor) {
      document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function setTab(element, type) {
      document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
      element.classList.add('active');
      if (type === 'bus') {
        toggleBusSheet();
      } else {
        document.getElementById('busSheet').classList.remove('open');
      }
    }
  </script>
</body>
</html>
