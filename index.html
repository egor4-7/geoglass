<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geoglass — 3D Map</title>
  
  <!-- Подключаем Leaflet CSS для живой карты -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b131e;
    }

    /* Карта на весь экран */
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #0b131e;
    }

    /* Убираем копирайты Leaflet для чистоты интерфейса */
    .leaflet-control-attribution {
      display: none !important;
    }

    /* Верхняя панель (Погода + Этажи) */
    .top-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }

    .top-overlay > * {
      pointer-events: auto;
    }

    /* Карточка погоды (Liquid Glass) */
    .weather-card {
      display: flex;
      align-items: center;
      background: rgba(15, 34, 61, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      gap: 8px;
    }

    /* Селектор этажей (2GIS style) */
    .floor-selector {
      background: rgba(15, 34, 61, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .floor-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .floor-btn.active {
      background: #28a745;
      color: #ffffff;
      font-weight: bold;
    }

    /* Нижняя панель управления */
    .bottom-overlay {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .bottom-overlay > * {
      pointer-events: auto;
    }

    /* Поисковая строка */
    .search-bar {
      display: flex;
      align-items: center;
      background: #f4f1ea;
      border-radius: 26px;
      padding: 10px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 12px;
    }

    .search-bar svg {
      width: 20px;
      height: 20px;
      fill: #0f223d;
      margin-right: 10px;
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      color: #0f223d;
      font-weight: 600;
      outline: none;
    }

    .search-input::placeholder {
      color: rgba(15, 34, 61, 0.5);
    }

    .mic-btn {
      background: #0f223d;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mic-btn svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
      margin: 0;
    }

    /* Категории (Горизонтальный скролл) */
    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      background: rgba(15, 34, 61, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .category-chip.active {
      background: #28a745;
      border-color: #ffffff;
    }

    /* Кастомный маркер автобуса */
    .bus-marker {
      background: rgba(40, 167, 69, 0.95);
      border: 2px solid #ffffff;
      border-radius: 20px;
      color: white;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 1. Интерактивная карта -->
  <div id="map"></div>

  <!-- 2. Верхняя панель -->
  <div class="top-overlay">
    <div class="weather-card">
      <span>⛅</span> +28°C
    </div>
    
    <div class="floor-selector">
      <button class="floor-btn" onclick="setFloor('3')">3</button>
      <button class="floor-btn" onclick="setFloor('2')">2</button>
      <button class="floor-btn" onclick="setFloor('1')">1</button>
      <button class="floor-btn active" onclick="setFloor('0')" id="f0">0</button>
      <button class="floor-btn" onclick="setFloor('-1')">-1</button>
      <button class="floor-btn" onclick="setFloor('-2')">-2</button>
    </div>
  </div>

  <!-- 3. Нижняя панель управления -->
  <div class="bottom-overlay">
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" class="search-input" placeholder="Поиск мест, отелей, остановок...">
      <button class="mic-btn">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.89 0 2.12-1.83 3.89-3.98 3.89-2.15 0-3.98-1.77-3.98-3.89 0-.5-.41-.89-.9-.89s-.9.39-.9.89c0 2.68 2.03 4.88 4.65 5.16v2.33h-2.5c-.55 0-1 .45-1 1s.45 1 1 1h7c.55 0 1-.45 1-1s-.45-1-1-1h-2.5v-2.33c2.62-.28 4.65-2.48 4.65-5.16 0-.5-.41-.89-.9-.89z"/></svg>
      </button>
    </div>

    <div class="categories-scroll">
      <button class="category-chip active" onclick="setTab(this)">Все</button>
      <button class="category-chip" onclick="setTab(this)">Прогулки</button>
      <button class="category-chip" onclick="setTab(this)">Еда</button>
      <button class="category-chip" onclick="setTab(this)">Транспорт</button>
      <button class="category-chip" onclick="setTab(this)">Пляжи</button>
    </div>
  </div>

  <!-- Подключаем Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Инициализация карты (центр: район Газипаша / Аланья)
    var map = L.map('map', { zoomControl: false }).setView([36.2655, 32.3025], 14);

    // Темная премиальная подложка карты
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    // Кастомный маркер автобуса
    var busIcon = L.divIcon({
      html: '<div class="bus-marker"><span>🚌</span> Автобус №101 • 3 мин</div>',
      className: '',
      iconSize: [150, 34],
      iconAnchor: [75, 17]
    });

    L.marker([36.2655, 32.3025], { icon: busIcon }).addTo(map);

    // Логика переключения этажей
    function setFloor(floor) {
      document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      console.log("Выбран этаж: " + floor);
    }

    // Логика переключения категорий
    function setTab(element) {
      document.querySelectorAll('.category-chip').forEach(chip => chip.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
